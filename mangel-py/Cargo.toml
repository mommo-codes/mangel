[package]
name = "mangel-py"
description = "Python bindings for mangel."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_mangel"
crate-type = ["cdylib"]

[dependencies]
# The binding depends on the core. The core does not know this crate exists,
# which is the point: PyO3 never reaches the shared implementation.
mangel = { path = "../mangel", version = "0.0.0" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
