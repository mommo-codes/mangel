# Sweden's spelling of each unit: the golden standard's, the spelling the
# register accepts.
#
#   "unit" = "spelling"
#
# Every unit is listed once, by its code: its SI symbol in lowercase, or
# "piece" for a count. How a label spells a unit is not here: that is the
# language's, in ../language/<code>/units.toml. See ../README.md before
# editing.

"g" = "g"
"kg" = "kg"
"ml" = "ml"
"cl" = "cl"
"dl" = "dl"
"l" = "L"
"piece" = "st"
