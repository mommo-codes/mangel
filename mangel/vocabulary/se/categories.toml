# Swedish categories: each category, and the group it sits in.
#
#   "Category" = "Group"
#
# The category is what a product is filed under and what the register stores;
# the group is the level above it. A category name appears once in the whole
# list, so it is the key. VAT per category is in category_vat.toml, which must
# name exactly the same categories. Grouped here for reading; order does not
# matter. See ../README.md before editing.

