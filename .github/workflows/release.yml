name: Release

on:
  push:
    tags:
      - "v*"
  # Every job below is a no-op when its registry already holds the version
  # in the tree, so a manual run is a safe way to exercise the build matrix
  # without releasing anything — as long as the tree's version is already
  # fully published. PyPI's skip-existing skips files, not versions, so a
  # new wheel target dispatched against a published version uploads.
  workflow_dispatch:

jobs:
  wheels:
    name: Wheels — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64, target: x86_64-unknown-linux-gnu }
          # Apple Silicon is an arm64 Linux container host, so without this
          # wheel `pip install mangel` fails inside any dev container on a
          # modern Mac — there is no sdist to fall back to. maturin
          # cross-compiles it from the x86_64 runner in a manylinux container.
          - { os: ubuntu-latest, name: linux-aarch64, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, name: macos-arm64, target: aarch64-apple-darwin }
          - { os: windows-latest, name: windows-x86_64, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --manifest-path mangel-py/Cargo.toml
          # Named explicitly rather than left to the runner's default, so
          # the matrix says what it produces and adding a target is a
          # one-line change.
          target: ${{ matrix.target }}
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          # Keyed on `name`, not `os` — two legs share ubuntu-latest and
          # would overwrite each other's artefact.
          name: wheels-${{ matrix.name }}
          path: dist

  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: wheels
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      # A release may be re-run to fix one registry without the others
      # having to be un-published. Already-uploaded files are not an error.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Gated on the wheels even though npm needs nothing from them: a release
    # is one tree across three registries, and without the gate a single
    # failing wheel target publishes npm and crates.io and leaves PyPI a
    # version behind.
    needs: wheels
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Published to the registry rather than consumed as a git dependency:
      # npm silently installs the repository root for a `github:` dependency,
      # and this repository's root is a Cargo workspace with no package.json.
      # A re-run to fix one registry must not fail on the ones that already
      # succeeded, and npm returns 403 for an existing version, which is
      # indistinguishable from a real refusal — so check first.
      - name: Build and publish
        working-directory: mangel-wasm/npm
        run: |
          npm install
          npm run build
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — nothing to do."
            exit 0
          fi
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # See the note on `npm`.
    needs: wheels
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The vocabulary lives inside mangel/, so `cargo publish` packages it
      # with build.rs and the published crate compiles it the same way.
      - name: Publish the core only
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='mangel'))")
          if curl -sf "https://crates.io/api/v1/crates/mangel/$VERSION" \
               -H "User-Agent: mangel-release" > /dev/null; then
            echo "mangel $VERSION is already on crates.io — nothing to do."
            exit 0
          fi
          cargo publish -p mangel --token ${{ secrets.CARGO_TOKEN }}
